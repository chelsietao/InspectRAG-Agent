[project]
name = "inspectrag-agent"
version = "0.1.0"
description = "Evidence-backed visual inspection workspace - vision baseline stage"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
vision = [
    "anomalib==2.7.0", "torch==2.15.0", "torchvision==0.29.2",
    "timm==1.0.30", "numpy==2.5.4", "scikit-learn==1.9.1", "matplotlib==3.11.2",
]

[tool.inspectrag]
stage = "vision-baseline"
